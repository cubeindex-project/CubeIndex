name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting
        run: npx prettier . --check

      - name: Verify lint rules
        run: npm run lint

      - name: Create local .env file from example
        run: cp .env.example .env

      - name: Run Svelte check
        run: npm run check

      - name: Run unit tests
        run: npm run test -- --passWithNoTests

      - name: Run build
        run: npm run build

      - name: Set up Supabase
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Check migrations and seed files
        run: supabase db reset

      - name: Verify generated types match Postgres schema
        run: |
          supabase gen types typescript --local > src/lib/types/database-generated.types.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet src/lib/types/database-generated.types.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi
